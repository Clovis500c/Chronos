name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh api repos/rojo-rbx/rojo/releases/latest \
            --jq '.assets[] | select(.name | test("linux-x86_64.zip$")) | .browser_download_url')
          curl -sSL -o rojo.zip "$URL"
          unzip -o rojo.zip
          chmod +x rojo

      - name: Build Chronos.rbxm
        run: ./rojo build default.project.json -o Chronos.rbxm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronos
          path: Chronos.rbxm

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" Chronos.rbxm --title "$TAG" --generate-notes \
            || gh release upload "$TAG" Chronos.rbxm --clobber
